<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoreDesign Identity</title>
  <style>
    /*
     * CoreDesign Identity landing page.
     *
     * Customize by copying this file to identity-templates/landing.html in your
     * host project and setting CopyToOutputDirectory to PreserveNewest.
     *
     * No dynamic placeholders are used in this template. All content is static.
     *
     * Theming: override the CSS custom properties in :root.
     */

    :root {
      --id-bg:            #f1f5f9;
      --id-surface:       #ffffff;
      --id-primary:       #4f46e5;
      --id-primary-hover: #4338ca;
      --id-primary-ring:  rgba(79, 70, 229, .15);
      --id-text:          #0f172a;
      --id-muted:         #64748b;
      --id-border:        #e2e8f0;
      --id-success:       #16a34a;
      --id-success-bg:    #f0fdf4;
      --id-success-border:#bbf7d0;
      --id-radius:        10px;
      --id-shadow:        0 4px 32px rgba(15, 23, 42, .10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Helvetica Neue', Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--id-text);
      background: var(--id-bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .id-card {
      background: var(--id-surface);
      border-radius: var(--id-radius);
      box-shadow: var(--id-shadow);
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 26rem;
    }

    /* Status badge */
    .id-status {
      display: flex;
      align-items: center;
      gap: .625rem;
      background: var(--id-success-bg);
      border: 1px solid var(--id-success-border);
      border-radius: 9999px;
      padding: .375rem .875rem;
      width: fit-content;
      margin: 0 auto 1.5rem;
      font-size: .8125rem;
      font-weight: 500;
      color: var(--id-success);
    }

    .id-status-dot {
      width: .5rem;
      height: .5rem;
      background: var(--id-success);
      border-radius: 50%;
    }

    /* Heading */
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      text-align: center;
      color: var(--id-text);
      margin-bottom: .375rem;
    }

    .id-subheading {
      font-size: .875rem;
      color: var(--id-muted);
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Endpoint list */
    .id-endpoints {
      list-style: none;
      border: 1px solid var(--id-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .id-endpoints li {
      border-bottom: 1px solid var(--id-border);
    }

    .id-endpoints li:last-child { border-bottom: none; }

    .id-endpoints a {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      color: var(--id-text);
      text-decoration: none;
      font-size: .875rem;
      transition: background .12s;
    }

    .id-endpoints a:hover { background: var(--id-bg); }

    .id-endpoint-method {
      flex-shrink: 0;
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--id-primary);
      background: var(--id-primary-ring);
      border-radius: 4px;
      padding: .125rem .375rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .id-endpoint-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8125rem;
      color: var(--id-muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .id-endpoint-label {
      font-size: .8125rem;
      color: var(--id-text);
      flex: 1;
    }

    .id-endpoint-arrow {
      color: var(--id-muted);
      font-size: .75rem;
    }

    /* Footer */
    .id-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: .6875rem;
      color: var(--id-muted);
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main class="id-card">

    <div class="id-status">
      <span class="id-status-dot" aria-hidden="true"></span>
      Running
    </div>

    <h1>CoreDesign Identity</h1>
    <p class="id-subheading">Development identity provider</p>

    <nav aria-label="OIDC endpoints">
      <ul class="id-endpoints">
        <li>
          <a href="/.well-known/openid-configuration">
            <span class="id-endpoint-method">GET</span>
            <span class="id-endpoint-label">OpenID Connect discovery</span>
            <span class="id-endpoint-arrow">&#8250;</span>
          </a>
        </li>
        <li>
          <a href="/.well-known/jwks.json">
            <span class="id-endpoint-method">GET</span>
            <span class="id-endpoint-label">JSON Web Key Set</span>
            <span class="id-endpoint-arrow">&#8250;</span>
          </a>
        </li>
        <li>
          <a href="/connect/authorize">
            <span class="id-endpoint-method">GET</span>
            <span class="id-endpoint-label">Authorization endpoint</span>
            <span class="id-endpoint-arrow">&#8250;</span>
          </a>
        </li>
      </ul>
    </nav>

    <p class="id-footer">CoreDesign Identity (Development only)</p>

  </main>
</body>
</html>
